<!DOCTYPE html>
<html>

<head>
    <title>Vidu 3</title>
</head>

<body>
    <ol type="I">
        <li>Mục 1
            <ol type="A">
                <li>Mục 1 - 1</li>
                <li>Mục 1 - 2</li>
            </ol>
        </li>
        <li>Mục 2</li>
        <li>Mục 3</li>
    </ol>


    <form action="" autocomplete="on">
        <label for="fullName">Họ tên:</label>
        <br />
        <input type="text" id="fullName" name="full_name" />
        <br />
        <label for="email">Email:</label>
        <br />
        <input type="email" id="email" name="email" />
        <br />
        <label for="age">Tuổi</label>
        <br />
        <input type="number" id="age" name="age" />
        <br />
        <label for="dob">Ngày sinh:</label>
        <br />
        <input type="date" id="dob" name="dob" />
        <br />
        <label for="time">Thời gian:</label>
        <br />
        <input type="time" id="time" name="time" />
        <br />
        <label for="datetime">Ngày giờ:</label>
        <br />
        <input type="datetime-local" id="datetime" name="time" />
        <br />
        <label for="note">Ghi chú:</label>
        <br />
        <textarea id="note" name="note"></textarea>
        <br />
        <label for="password">Mật khẩu:</label>
        <br />
        <input type="password" id="password" name="password" />
        <br />
        <input type="file" />
        <br />
        <br />
        <input type="submit" value="Gửi">

        <br />
        <br />
        <p>Những ngôn ngữ lập trình bạn đã học:</p>
        <input type="checkbox" id="ngonNguC" name="language" value="C">
        <label for="ngonNguC">Ngôn ngữ C</label>
        <br />
        <input type="checkbox" id="NgonNguJava" name="language" value="java">
        <label for="ngonNguJava">Ngôn ngữ Java</label>
        <br />
        <input type="checkbox" id="ngonNguPhp" name="language" value="php">
        <label for="ngonNguPhp">Ngôn ngữ PHP</label>

        <br />
        <p>Giới tính:</p>
        <input type="radio" id="nam" name="gioiTinh" value="Nam">
        <label for="nam">Nam</label>
        <br />

        <input type="radio" id="nu" name="gioiTinh" value="Nữ">
        <label for="nu">Nữ</label>
        <br />

        <input type="radio" id="khac" name="gioiTinh" value="Khác">
        <label for="khac">Khác</label>
        <br />

    </form>

    <form action="">
        <label for="colors">Chọn màu:</label>
        <br />
        <select id="colors" name="color">
            <option value="yellow">Vàng</option>
            <option value="red">Đỏ</option>
            <option value="blue">Xanh</option>
            <option value="green">Xanh lá</option>
            <option value="black">Đen</option>
        </select>
    </form>
</body>

</html>
