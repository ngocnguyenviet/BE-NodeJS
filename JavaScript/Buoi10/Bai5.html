<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        .tabs-container {
            width: 500px;
            margin: 40px auto;
            border: 1px solid #ddd;
        }

        .tab-header {
            display: flex;
            background-color: #f1f1f1;
        }

        .tab-btn {
            padding: 10px 20px;
            border: none;
            background-color: inherit;
            cursor: pointer;
            font-size: 14px;
            color: #333;
        }

        .tab-btn:hover {
            background-color: #ddd;
        }

        .tab-btn.active {
            background-color: #ccc;
            font-weight: bold;
        }

        .tab-content {
            display: none;
            padding: 20px;
        }

        .tab-content.active {
            display: block;
        }

        .tab-content h3 {
            margin-bottom: 12px;
        }
    </style>
</head>

<body>
    <div class="tabs-container">
        <div class="tab-header" id="tabHeader">
            <button class="tab-btn active" data-target="tab-1">Tab 1</button>
            <button class="tab-btn" data-target="tab-2">Tab 2</button>
            <button class="tab-btn" data-target="tab-3">Tab 3</button>
        </div>

        <div id="tab-1" class="tab-content active">
            <h3>Nội dung của Tab 1</h3>
            <p>Đây là nội dung của Tab 1</p>
        </div>

        <div id="tab-2" class="tab-content">
            <h3>Nội dung của Tab 2</h3>
            <p>Đây là nội dung của Tab 2</p>
        </div>

        <div id="tab-3" class="tab-content">
            <h3>Nội dung của Tab 3</h3>
            <p>Đây là nội dung của Tab 3</p>
        </div>
    </div>

    <script>
        const tabHeader = document.getElementById('tabHeader');
        const tabButtons = document.querySelectorAll('.tab-btn');
        const tabContents = document.querySelectorAll('.tab-content');

        tabHeader.addEventListener('click', (e) => {
            const clickedBtn = e.target.closest('.tab-btn');
            if (!clickedBtn) return;

            tabButtons.forEach(btn => btn.classList.remove('active'));
            tabContents.forEach(content => content.classList.remove('active'));

            clickedBtn.classList.add('active');

            const targetId = clickedBtn.dataset.target;
            document.getElementById(targetId).classList.add('active');
        });
    </script>
</body>

</html>
