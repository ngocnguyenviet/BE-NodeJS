    <ul id="product-list">
        <li>Sản phẩm 1 <button class="btn-delete">Xóa</button></li>
        <li>Sản phẩm 2 <button class="btn-delete">Xóa</button></li>
    </ul>

    <script>
        const productList = document.getElementById('product-list');

        productList.addEventListener('click', function (event) {
            if (event.target.classList.contains('btn-delete')) {
                const item = event.target.closest('li');
                console.log("Đang xóa phần tử: ", item.textContent);
                item.remove();
            }
        });
    </script>
