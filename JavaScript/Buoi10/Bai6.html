<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: sans-serif;
        }

        .calculator-card {
            width: 320px;
            margin: 40px auto;
            padding: 24px;
            border: 1px solid #ddd;
            border-radius: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .calculator-card h2 {
            margin-top: 0;
            margin-bottom: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 12px;
        }

        .input-group input {
            padding: 6px 8px;
            font-size: 14px;
            border: 1px solid #aaa;
            outline: none;
        }

        .btn-group {
            display: flex;
            gap: 4px;
            margin-bottom: 16px;
        }

        .btn-group button {
            padding: 4px 10px;
            cursor: pointer;
            border: 1px solid #aaa;
            background-color: #efefef;
            border-radius: 2px;
        }

        .btn-group button:hover {
            background-color: #e0e0e0;
        }

        .result {
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="calculator-card">
        <h2>Máy tính</h2>

        <div class="input-group">
            <input type="number" id="numA" placeholder="Nhập số thứ nhất">
            <input type="number" id="numB" placeholder="Nhập số thứ hai">
        </div>

        <div class="btn-group" id="btnGroup">
            <button data-op="add">Cộng</button>
            <button data-op="sub">Trừ</button>
            <button data-op="mul">Nhân</button>
            <button data-op="div">Chia</button>
        </div>

        <div class="result" id="resultText">Kết quả: </div>
    </div>

    <script>
        const numAInput = document.getElementById('numA');
        const numBInput = document.getElementById('numB');
        const btnGroup = document.getElementById('btnGroup');
        const resultText = document.getElementById('resultText');

        btnGroup.addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (!btn) return;

            if (numAInput.value.trim() === "" || numBInput.value.trim() === "") {
                resultText.textContent = 'Vui long nhập đủ 2 số !';
                return;
            }

            const a = parseFloat(numAInput.value);
            const b = parseFloat(numBInput.value);
            const operation = btn.dataset.op;
            let result = 0;

            switch (operation) {
                case 'add':
                    result = a + b;
                    break;
                case 'sub':
                    result = a - b;
                    break;
                case 'mul':
                    result = a * b;
                    break;
                case 'div':
                    if (b === 0) {
                        resultText.textContent = "Không thể chia cho 0!";
                        return;
                    }
                    result = a / b;
                    break;
            }

            resultText.textContent = `Kết quả: ${result}`;
        });
    </script>
</body>

</html>
